[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afrosat-eo-platform"
version = "0.1.0"
description = "AFROSAT Earth observation platform for Sentinel-2 optical and AIRSAT-05 SAR processing"
requires-python = ">=3.12"

dependencies = [
    "pystac-client",
    "pystac",
    "odc-stac",
    "rioxarray",
    "xarray",
    "dask",
    "rasterio",
    "numpy",
    "pandas",
    "matplotlib",
    "shapely",
    "pyproj",
    "requests",
    "Pillow",
    "rio-cogeo==5.4.2",
    "fastapi",
    "uvicorn",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
